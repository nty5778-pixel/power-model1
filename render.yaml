services:
  - type: web
    name: ercot-dart-model
    runtime: python
    plan: starter          # free 는 15분 idle 후 spin-down → 콜드스타트 발생
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT --timeout-keep-alive 120
    healthCheckPath: /health
    envVars:
      - key: API_KEY
        sync: false        # Render 대시보드에서 직접 입력 (n8n 과 공유)
      - key: DATA_DIR
        value: /opt/render/project/src/data
      - key: PYTHON_VERSION
        value: "3.11"
